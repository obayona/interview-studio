[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = [
    "backend.interview_engine",
    "backend.app",
    "backend.profile_parser",
    "backend.report_engine",
]

[[tool.mypy.overrides]]
module = "yoyo.*"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["backend/interview_engine", "backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
