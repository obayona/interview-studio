map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream interview_studio_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1;

    root /app/frontend;
    index index.html;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws:; font-src 'self' data:; worker-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    location ^~ /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api/ {
        proxy_pass http://interview_studio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /health/ {
        proxy_pass http://interview_studio_backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
