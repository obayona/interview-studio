[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["backend.interview_engine"]

[tool.coverage.run]
branch = true
source = ["backend/interview_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
